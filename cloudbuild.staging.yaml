# STAGING ONLY (docs/staging/plan.md). Run by the Cloud Build trigger `staging-deploy` (europe-west3) on pushes
# to fields-* / infra-* branches, as staging-builder@ -- which has no rights on anything in production.
# Production keeps using cloudbuild.yaml through ~/claude-helpers/deploy.sh.
steps:
  - id: deps
    name: 'node:20'
    entrypoint: npm
    args: ['ci', '--no-audit', '--no-fund']

  - id: db
    name: 'node:20'
    entrypoint: bash
    args: ['scripts/staging/db-step.sh']
    secretEnv: ['STAGING_DB_URL']

  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/bill-scanner-staging-repo/app:$BUILD_ID'
      - .

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/bill-scanner-staging-repo/app:$BUILD_ID']

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bill-scanner-app-staging
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/bill-scanner-staging-repo/app:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=bill-scanner-staging@$PROJECT_ID.iam.gserviceaccount.com
      - --no-invoker-iam-check
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:bill-scanner-staging-db
      - --set-secrets=DATABASE_URL=staging-db-url:latest,CRON_SECRET=staging-cron-secret:latest,TASKS_SECRET=staging-tasks-secret:latest,PORTAL_SECRET=staging-portal-secret:latest,MAIL_TOKEN_ENC_KEY=staging-mail-token-enc-key:latest,BANK_TOKEN_ENC_KEY=staging-bank-token-enc-key:latest,PDF_SECRET=pdf-secret:latest,MAIL_OAUTH_CLIENT_SECRET=mail-oauth-client-secret:latest
      # Deliberately absent: CANONICAL_HOST (would 308 staging to tabornik.online), LB_IP, STAGING_MAIL_REDIRECT
      # (unset = staging mail goes back to the sending mailbox, src/lib/app-env.ts).
      - --set-env-vars=APP_ENV=staging,APP_BASE_URL=${_STAGING_URL},GCS_BUCKET_NAME=bill-scanner-v2-files-staging,GCS_SIGNING_SERVICE_ACCOUNT=bill-scanner-staging@$PROJECT_ID.iam.gserviceaccount.com,DRIVE_SERVICE_ACCOUNT_EMAIL=bill-scanner-drive-staging@$PROJECT_ID.iam.gserviceaccount.com,CLOUD_TASKS_QUEUE=bill-ai-queue-staging,CLOUD_TASKS_LOCATION=${_REGION},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AI_SERVICE_URL=https://bill-scanner-ai-sml4zhisya-ew.a.run.app,PDF_SERVICE_URL=https://bill-scanner-pdf-1050716617948.europe-west3.run.app,MAIL_OAUTH_CLIENT_ID=1050716617948-nb9u6ov1v9gj3k29kfoiu3rf7ngqv6bj.apps.googleusercontent.com
      - --cpu=1
      - --memory=2Gi
      - --timeout=600
      - --min-instances=0
      - --max-instances=1
      - --cpu-throttling

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/staging-db-url/versions/latest
      env: STAGING_DB_URL

substitutions:
  _REGION: europe-west3
  _STAGING_URL: https://bill-scanner-app-staging-1050716617948.europe-west3.run.app
  _FIREBASE_AUTH_DOMAIN: prvni-beh-filesaver.firebaseapp.com
  _FIREBASE_PROJECT_ID: prvni-beh-filesaver
  _FIREBASE_APP_ID: 1:1050716617948:web:a1acc96daddf0985da4819

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/bill-scanner-staging-repo/app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
